name: Sync Asana → data.json

on:
  schedule:
    # Runs every 2 hours (adjust as needed — GitHub Actions minimum is every 5 min)
    - cron: "0 */2 * * *"
  workflow_dispatch:  # allows manual "Run workflow" button in GitHub UI

# Required permissions for GitHub Pages deploy
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # ── 1. Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 3. Install dependencies
      - name: Install requests
        run: pip install requests

      # ── 4. Run the Asana sync script
      - name: Sync Asana data
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
        run: python sync_asana.py

      # ── 5. Commit the refreshed data.json back to the repo
      - name: Commit data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          # Only commit if there are actual changes
          git diff --staged --quiet || git commit -m "chore: sync Asana data $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push

      # ── 6. Upload site to GitHub Pages
      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
